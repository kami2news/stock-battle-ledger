<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株式対戦 記録場</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 帳簿。数字だけを静かに、正確に並べる（KM1 / Fluent 2 準拠）
   IDEA: 証券会社の取引残高報告書。2人分の口座を左右に並べた台帳
   PICTURE: 2口座の合計資産カードと、合計資産の推移グラフ（警告線 200,000 円）
   COLOUR and TYPE: KM1 ブランド #10218B、Muse は橙＋破線。Segoe UI / Noto Sans JP、数字は等幅数字
   LAYOUT: 口座カード → 推移 → 保有 → 売買実績 → 現在値 → 記入欄。600px 未満は縦積み */
:root{color-scheme:light dark;
--bg:light-dark(#f5f5f5,#141414);--card:light-dark(#ffffff,#242424);--ink:light-dark(#242424,#f0f0f0);
--sub:light-dark(#616161,#adadad);--line:light-dark(#e0e0e0,#3d3d3d);
--brand:light-dark(#10218B,#9aa6f5);--claude:light-dark(#10218B,#9aa6f5);--muse:light-dark(#BC4B09,#F4A15D);
--warn:light-dark(#8a5300,#ffcf6e);--warnbg:light-dark(#fff4ce,#3d2e00);--stop:light-dark(#b10e1c,#ff8f99);--stopbg:light-dark(#fde7e9,#3f1011);
--okbg:light-dark(#e6f2e6,#0f2f12);--ok:light-dark(#0e700e,#7fd67f);--pos:light-dark(#0e700e,#7fd67f);--neg:light-dark(#b10e1c,#ff8f99)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI","Noto Sans JP",system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
header,section{padding:20px max(4vw,16px);max-width:1240px;margin:0 auto}
h1{font-size:28px;line-height:1.15;margin:8px 0 4px;font-weight:700}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.meta{color:var(--sub);font-size:13px;margin:0}
.col{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.claude{background:var(--claude)}.dot.muse{background:var(--muse)}
.badge{margin-left:auto;font-size:13px;font-weight:700;padding:2px 10px;border-radius:4px}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.stop{background:var(--stopbg);color:var(--stop)}
.total{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.1;margin:12px 0 2px;white-space:nowrap}
.total small{font-size:16px;font-weight:600;margin-left:4px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0}
dt{color:var(--sub);font-size:13px}dd{margin:0;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.fig{position:relative;height:300px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px;text-align:left}
td.n,th.n{text-align:right}
tr.bad td{color:var(--sub);text-decoration:line-through}tr.bad td.st{text-decoration:none;color:var(--stop)}
.empty{color:var(--sub);font-size:13px;padding:8px 0}
.sub{font-size:14px;font-weight:600;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink);min-height:32px;padding:0 14px}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
:root[data-theme=dark] .seg button[aria-pressed=true]{color:#141414}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button[aria-pressed=true]{color:#141414}}
form{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;align-items:end;margin-top:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-bottom:1px solid var(--sub);border-radius:4px;padding:6px 8px;min-height:32px;width:100%}
textarea{min-height:88px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{font:inherit;font-weight:600;min-height:32px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme=dark] button.primary{color:#141414}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button.primary{color:#141414}}
button:disabled{opacity:.45;cursor:not-allowed}
a.del{font-size:12px;color:var(--sub)}
button.del{min-height:28px;padding:0 8px;font-size:12px;font-weight:400}
button.del.arm{background:var(--stopbg);color:var(--stop);border-color:var(--stop)}
.res button{margin-top:6px}
a.go{display:inline-flex;align-items:center;min-height:32px;padding:0 16px;border-radius:4px;background:var(--brand);color:#fff;font-weight:600;text-decoration:none;margin-top:6px}
:root[data-theme=dark] a.go{color:#141414}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) a.go{color:#141414}}
.res code{font-size:13px;overflow-wrap:anywhere}
.res{font-size:13px;margin-top:8px;white-space:pre-wrap}
.res .ng{color:var(--stop)}.res .okc{color:var(--ok)}
#conn{font-size:13px;color:var(--stop)}
.stopnote{color:var(--stop);font-size:13px;font-weight:600;margin:6px 0 0}
.stopnote:empty{display:none}
body.loading #cards,body.loading #holds,body.loading #trades,body.loading #prices,body.loading .fig{opacity:.35}
.hist{max-height:320px;overflow:auto}
details summary{cursor:pointer;font-size:13px;color:var(--sub);margin-top:8px;min-height:32px;display:flex;align-items:center}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}h1{font-size:24px}button,.seg button{min-height:44px}input,select{min-height:44px}}
</style>
</head>
<body>
<header>
<p class="meta">シミュレーション専用・実資金なし ／ 元本 各 500,000 円</p>
<h1>株式投資シミュレーション対戦 記録場</h1>
<p class="meta" id="asof">—</p>
<p id="conn" hidden></p>
</header>

<section><div class="grid2" id="cards"></div></section>

<section><div class="card">
<h2>合計資産の推移</h2>
<div class="fig" id="fig"><svg id="chart" role="img" aria-label="合計資産の推移"></svg></div>
<div class="legend"><span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--claude)" stroke-width="3"/></svg>Claude</span><span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--muse)" stroke-width="3" stroke-dasharray="6 4"/></svg>Muse</span><span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--warn)" stroke-width="2" stroke-dasharray="2 3"/></svg>警告 200,000 円</span></div>
<details class="histbox"><summary>推移の表（新しい順）</summary><div class="scroll hist"><table id="hist"></table></div></details>
</div></section>

<section><div class="col" id="holds"></div></section>
<section><div class="col" id="trades"></div></section>

<section><div class="card"><h2>現在値（記入者ごとの最新）</h2><div id="prices"></div></div></section>

<section><div class="card" id="entry">
<h2>記入</h2>
<div class="sub">記入者 <span class="seg" id="pseg"><button type="button" data-p="claude" aria-pressed="true">Claude</button><button type="button" data-p="muse" aria-pressed="false">Muse</button></span><span class="meta" id="lock"></span></div>
<div id="pwrow" hidden><label style="max-width:320px">パスワード（Muse の記入用）<input type="password" id="pw" autocomplete="off"></label></div>
<form id="tf" novalidate>
<label>日付（YYYY-MM-DD）<input id="f-d" inputmode="numeric" placeholder="2026-12-01" pattern="\d{4}-\d{2}-\d{2}" required></label>
<label>売買<select id="f-s"><option value="buy">買</option><option value="sell">売</option></select></label>
<label>コード<input id="f-c" maxlength="8" required></label>
<label>銘柄名<input id="f-n" maxlength="40" required></label>
<label>数量（株）<input id="f-q" type="number" min="1" step="1" required></label>
<label>約定価格（円）<input id="f-px" type="number" min="0.01" step="0.01" required></label>
<button class="primary" id="f-go">売買を確認</button>
</form>
<p class="stopnote" id="stopmsg" role="status"></p>
<div class="res" id="f-res" role="status" aria-live="polite"></div>
<div class="sub">現在値</div>
<form id="pf" novalidate>
<label>日付（YYYY-MM-DD）<input id="p-d" inputmode="numeric" placeholder="2026-12-01" pattern="\d{4}-\d{2}-\d{2}" required></label>
<label>コード<input id="p-c" maxlength="8" required></label>
<label>銘柄名<input id="p-n" maxlength="40" required></label>
<label>現在値（円）<input id="p-px" type="number" min="0" step="0.01" required></label>
<button class="primary" id="p-go">現在値を確認</button>
</form>
<div class="res" id="p-res" role="status" aria-live="polite"></div>
</div></section>

<script>
{
/*CALC*/
const START=500000,WARN=200000,PS=["claude","muse"],PN={claude:"Claude",muse:"Muse"};
const jstOf=ms=>new Date(ms+9*36e5).toISOString();
function realDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||""))return false;const[y,m,dd]=d.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,dd));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===dd}
const okDate=(d,today)=>realDate(d)&&d<=(today||jstOf(Date.now()).slice(0,10));
function fmtTrade(t){return t&&PS.includes(t.p)&&(t.side==="buy"||t.side==="sell")&&String(t.code||"").trim()!==""&&Number.isInteger(t.qty)&&t.qty>0&&typeof t.px==="number"&&t.px>0}
function okPrice(p){return p&&(p.p===undefined||p.p===null||PS.includes(p.p))&&String(p.code||"").trim()!==""&&typeof p.px==="number"&&isFinite(p.px)&&p.px>=0}
// 並び順と推移の区切り：日付＋（記入時刻がその日付と同じ日なら）時:分
const evKey=x=>{const s=x.ts?jstOf(x.ts):"";return x.d+(s.slice(0,10)===x.d?" "+s.slice(11,16):"")};
function compute(trades,prices,today){
  today=today||jstOf(Date.now()).slice(0,10);
  const status=new Map(),pstatus=new Map(),out={};
  const ev=[];
  for(const t of trades){if(!fmtTrade(t)){status.set(t.id,"形式不正");continue}if(!okDate(t.d,today)){status.set(t.id,"日付不正");continue}ev.push({k:"t",x:t})}
  for(const p of prices){if(!okPrice(p)){pstatus.set(p.id,"形式不正");continue}if(!okDate(p.d,today)){pstatus.set(p.id,"日付不正");continue}pstatus.set(p.id,"有効");ev.push({k:"p",x:p})}
  // 同じ日付・時刻では現在値を売買より先に処理する
  ev.sort((a,b)=>a.x.d<b.x.d?-1:a.x.d>b.x.d?1:((a.x.ts||0)-(b.x.ts||0))||(a.k===b.k?0:a.k==="p"?-1:1));
  const keys=[...new Set(ev.map(e=>evKey(e.x)))];
  const S={};
  for(const p of PS)S[p]={cash:START,pos:{},realized:0,stopped:false,stopKey:null,rec:{},trd:{},hist:[{d:"開始",total:START}]};
  const pxOf=(s,c)=>s.rec[c]||s.trd[c]||null;
  const value=s=>{let v=0;for(const[c,h]of Object.entries(s.pos)){const q=pxOf(s,c);v+=h.qty*(q?q.px:h.avg)}return v};
  let i=0;
  for(const k of keys){
    const grp=[];while(i<ev.length&&evKey(ev[i].x)===k)grp.push(ev[i++]);
    for(const e of grp)if(e.k==="p"){const pr=e.x;for(const p of PS)if(!pr.p||pr.p===p)S[p].rec[pr.code]={px:pr.px,d:pr.d}}
    for(const p of PS){const s=S[p];if(!s.stopped&&s.cash+value(s)<=0){s.stopped=true;s.stopKey=k}}
    for(const e of grp){if(e.k!=="t")continue;const t=e.x,s=S[t.p];
      if(s.stopped){status.set(t.id,"中止後");continue}
      const amt=t.qty*t.px;
      if(t.side==="buy"){
        if(amt>s.cash+1e-9){status.set(t.id,"現金不足");continue}
        const h=s.pos[t.code]||{qty:0,avg:0,name:t.name};
        h.avg=(h.avg*h.qty+amt)/(h.qty+t.qty);h.qty+=t.qty;h.name=t.name||h.name;s.pos[t.code]=h;s.cash-=amt;
      }else{
        const h=s.pos[t.code];
        if(!h||h.qty<t.qty){status.set(t.id,"保有不足");continue}
        s.realized+=(t.px-h.avg)*t.qty;s.cash+=amt;h.qty-=t.qty;if(h.qty===0)delete s.pos[t.code];
      }
      s.trd[t.code]={px:t.px,d:t.d};
      status.set(t.id,"有効");
    }
    for(const p of PS){const s=S[p],total=s.cash+value(s);if(!s.stopped&&total<=0){s.stopped=true;s.stopKey=k}s.hist.push({d:k,total})}
  }
  for(const p of PS){
    const s=S[p];
    const holds=Object.entries(s.pos).map(([code,h])=>{const q=pxOf(s,code);const cur=q?q.px:h.avg;const mv=h.qty*cur,cost=h.qty*h.avg;
      return{code,name:h.name,qty:h.qty,avg:h.avg,cur,curD:q?q.d:null,mv,ul:mv-cost,ulr:cost?(mv-cost)/cost:0}});
    const stock=holds.reduce((a,h)=>a+h.mv,0),cost=holds.reduce((a,h)=>a+h.qty*h.avg,0),total=s.cash+stock;
    const stopped=s.stopped||total<=0;
    const state=stopped?"中止":total<WARN?"警告":"正常";
    out[p]={cash:s.cash,stock,total,realized:s.realized,ul:stock-cost,ulr:cost?(stock-cost)/cost:0,holds,hist:s.hist,state,stopped,stopKey:s.stopKey||(stopped?keys[keys.length-1]||null:null),lastPx:s.rec,lastTrd:s.trd};
  }
  const lastDate=keys.length?keys[keys.length-1].slice(0,10):null;
  return{acct:out,status,pstatus,dates:keys,lastDate,sorted:trades.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0))};
}
/*END*/
const REPO="kami2news/stock-battle-ledger",BR="main";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=v=>Math.round(v).toLocaleString("ja-JP")+" 円";
const syen=v=>(v>0?"+":v<0?"−":"±")+Math.abs(Math.round(v)).toLocaleString("ja-JP")+" 円";
const pct=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v*100).toFixed(2)+" %";
const px=v=>Number(v).toLocaleString("ja-JP",{maximumFractionDigits:2})+" 円";
const cls=v=>v>0?"pos":v<0?"neg":"";
const jst=()=>jstOf(Date.now());
const today=()=>jst().slice(0,10);
const hhmm=ts=>ts?jstOf(ts).slice(11,16):"";
const own=(f,p)=>new RegExp("^\\d{8}-\\d{6}-"+p+"-").test(f||"");
const delUrl=f=>`https://github.com/${REPO}/delete/${BR}/entries/${encodeURIComponent(f)}`;
const rmBtn=(f,p)=>CFG&&p==="muse"&&own(f,"muse")?`<button type="button" class="del" data-rm="${esc(f)}">取消</button>`:`<a class="del" href="${esc(delUrl(f))}" target="_blank" rel="noopener">取消</a>`;
let TR=[],PR=[],BAD=0,BUILT=null,LOADING=true,R=compute([],[]),P="claude";
const stopNote=a=>a.stopped?`中止：${esc(a.stopKey||"")} に合計資産が 0 円。以後の売買は無効（誤った記入を取り消すと再計算されます）`:"";

function render(){
  R=compute(TR,PR,today());
  document.body.classList.toggle("loading",LOADING);
  $("asof").textContent=LOADING?"読み込み中…（表示は集計データの読み込み後に確定します）":(R.lastDate?"最終記入日 "+R.lastDate:"記入なし（初期状態）")+(BUILT?" ／ 集計 "+new Date(BUILT).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"}):"")+(BAD?" ／ 形式不正の行 "+BAD:"");
  $("cards").innerHTML=PS.map(p=>{const a=R.acct[p],b=a.state==="中止"?"stop":a.state==="警告"?"warn":"ok";
    return`<div class="card"><div class="who"><span class="dot ${p}"></span>${PN[p]}<span class="badge ${b}">${LOADING?"…":a.state}</span></div>
    <div class="total">${LOADING?"—":Math.round(a.total).toLocaleString("ja-JP")}<small>円</small></div><p class="meta">合計資産（元本比 <span class="${cls(a.total-START)}">${LOADING?"—":pct((a.total-START)/START)}</span>）</p>
    ${a.stopped&&!LOADING?`<p class="stopnote">${stopNote(a)}</p>`:""}
    <dl><dt>現金残高</dt><dd>${yen(a.cash)}</dd><dt>株式時価</dt><dd>${yen(a.stock)}</dd>
    <dt>含み損益</dt><dd class="${cls(a.ul)}">${syen(a.ul)}</dd><dt>含み損益率</dt><dd class="${cls(a.ul)}">${pct(a.ulr)}</dd>
    <dt>実現損益</dt><dd class="${cls(a.realized)}">${syen(a.realized)}</dd></dl></div>`}).join("");
  $("holds").innerHTML=PS.map(p=>{const h=R.acct[p].holds;return`<div class="card"><h2><span class="who"><span class="dot ${p}"></span>${PN[p]} 保有銘柄</span></h2>${h.length?`<div class="scroll"><table>
    <tr><th>銘柄名</th><th>コード</th><th class="n">数量</th><th class="n">平均取得単価</th><th class="n">現在値</th><th>現在値日付</th><th class="n">時価</th><th class="n">含み損益</th><th class="n">含み損益率</th></tr>
    ${h.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td class="n">${x.qty.toLocaleString("ja-JP")}</td><td class="n">${px(x.avg)}</td><td class="n">${px(x.cur)}</td><td>${esc(x.curD||"—")}</td><td class="n">${yen(x.mv)}</td><td class="n ${cls(x.ul)}">${syen(x.ul)}</td><td class="n ${cls(x.ul)}">${pct(x.ulr)}</td></tr>`).join("")}</table></div>`:`<div class="empty">${LOADING?"読み込み中…":"保有なし"}</div>`}</div>`}).join("");
  $("trades").innerHTML=PS.map(p=>{const t=R.sorted.filter(x=>x.p===p);return`<div class="card"><h2><span class="who"><span class="dot ${p}"></span>${PN[p]} 売買実績</span></h2>${t.length?`<div class="scroll"><table>
    <tr><th>日付</th><th>記入時刻</th><th>売買</th><th>銘柄名</th><th>コード</th><th class="n">数量</th><th class="n">約定価格</th><th class="n">約定金額</th><th>判定</th><th></th></tr>
    ${t.map(x=>{const st=R.status.get(x.id)||"形式不正";return`<tr class="${st==="有効"?"":"bad"}"><td>${esc(x.d)}</td><td>${esc(hhmm(x.ts))}</td><td>${x.side==="buy"?"買":x.side==="sell"?"売":"?"}</td><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td class="n">${esc(Number(x.qty).toLocaleString("ja-JP"))}</td><td class="n">${esc(px(x.px))}</td><td class="n">${esc(yen(x.qty*x.px||0))}</td><td class="st">${st}</td><td>${rmBtn(x.file,p)}</td></tr>`}).join("")}</table></div>`:`<div class="empty">${LOADING?"読み込み中…":"記入なし"}</div>`}</div>`}).join("");
  // 現在値：参加者×銘柄ごとに最新の1件だけを表示。全件は折りたたみ
  const who=x=>x.p?PN[x.p]:"共通（旧形式）";
  const all=PR.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
  const seen=new Set(),latest=all.filter(x=>{const k=(x.p||"-")+"|"+x.code;if(seen.has(k))return false;seen.add(k);return true});
  const prow=x=>{const st=R.pstatus.get(x.id)||"形式不正";return`<tr class="${st==="有効"?"":"bad"}"><td>${esc(who(x))}</td><td>${esc(x.d)}</td><td>${esc(hhmm(x.ts))}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${esc(px(x.px))}</td><td class="st">${st}</td><td>${rmBtn(x.file,x.p)}</td></tr>`};
  const phead=`<tr><th>記入者</th><th>日付</th><th>記入時刻</th><th>コード</th><th>銘柄名</th><th class="n">現在値</th><th>判定</th><th></th></tr>`;
  $("prices").innerHTML=latest.length?`<div class="scroll"><table>${phead}${latest.map(prow).join("")}</table></div>`+(all.length>latest.length?`<details><summary>全件（${all.length} 件）</summary><div class="scroll"><table>${phead}${all.map(prow).join("")}</table></div></details>`:""):`<div class="empty">${LOADING?"読み込み中…":"記入なし"}</div>`;
  const H={claude:R.acct.claude.hist,muse:R.acct.muse.hist};
  $("hist").innerHTML=`<tr><th>日付・時刻</th><th class="n">Claude 合計資産</th><th class="n">Muse 合計資産</th></tr>`+H.claude.map((h,i)=>({h,m:H.muse[i]})).reverse().map(({h,m})=>`<tr><td>${esc(h.d)}</td><td class="n">${yen(h.total)}</td><td class="n">${yen(m.total)}</td></tr>`).join("");
  const a=R.acct[P];$("f-go").disabled=LOADING||a.stopped;$("p-go").disabled=LOADING;
  $("stopmsg").textContent=a.stopped&&!LOADING?`${PN[P]} は${stopNote(a)}。`:"";
  draw();
}
const svg=$("chart");
function draw(){
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const A=R.acct.claude.hist,B=R.acct.muse.hist,n=A.length,all=[...A,...B].map(h=>h.total);
  let lo=Math.min(WARN,...all),hi=Math.max(START,...all);const pad=(hi-lo)*.08||50000;lo=Math.max(0,lo-pad);hi+=pad;
  const L=W<520?56:88,Rm=16,T=12,Bm=28,x=i=>L+(n<2?(W-L-Rm)/2:i*(W-L-Rm)/(n-1)),y=v=>T+(hi-v)/(hi-lo)*(H-T-Bm);
  const ticks=[0,1,2,3,4].map(k=>lo+(hi-lo)*k/4);
  const path=a=>a.map((h,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(h.total).toFixed(1)).join(" ");
  const lab=[0,n-1].filter((v,i,s)=>s.indexOf(v)===i),wy=y(WARN);
  svg.innerHTML=ticks.map(t=>`<line x1="${L}" x2="${W-Rm}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${W<520?Math.round(t/1000)+"k":Math.round(t).toLocaleString("ja-JP")}</text>`).join("")
   +`<line x1="${L}" x2="${W-Rm}" y1="${wy}" y2="${wy}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/><text x="${W-Rm}" y="${wy-5}" text-anchor="end" font-size="11" font-weight="600" fill="var(--warn)">警告 200,000</text>`
   +`<path d="${path(A)}" fill="none" stroke="var(--claude)" stroke-width="3"/><path d="${path(B)}" fill="none" stroke="var(--muse)" stroke-width="3" stroke-dasharray="6 4"/>`
   +(n<=60?A.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.total)}" r="3" fill="var(--claude)"/>`).join("")+B.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.total)}" r="3" fill="var(--muse)"/>`).join(""):"")
   +lab.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${n<2?"middle":i===0?"start":"end"}" font-size="11" fill="var(--sub)">${esc(A[i].d)}</text>`).join("");
}
const ro=new ResizeObserver(draw);ro.observe($("fig"));

const num=s=>String(s).trim()===""?NaN:Number(String(s).replace(/[,，円\s]/g,""));
const fname=kind=>{const s=jst().replace(/[-:T]/g,"").slice(0,14);return`${s.slice(0,8)}-${s.slice(8,14)}-${kind}-${Math.random().toString(36).slice(2,6)}.txt`};
const newUrl=(file,line)=>`https://github.com/${REPO}/new/${BR}?filename=${encodeURIComponent("entries/"+file)}&value=${encodeURIComponent(line+"\n")}`;
let CFG=null,TOK=null;
const API=`https://api.github.com/repos/${REPO}/contents/entries/`;
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const b64u=s=>{const b=new TextEncoder().encode(s);let o="";for(const x of b)o+=String.fromCharCode(x);return btoa(o)};
async function token(){
  if(TOK)return TOK;const pw=$("pw").value;if(!pw)throw"パスワード未入力";
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(CFG.salt),iterations:CFG.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  try{TOK=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(CFG.iv)},key,b64d(CFG.ct)))}catch(_){throw"パスワードが違います"}
  return TOK;
}
async function gh(path,opt={}){const t=await token();const r=await fetch(API+path,{...opt,headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});if(!r.ok)throw"GitHub "+r.status;return r.status===204?null:r.json()}
async function putEntry(file,line){try{await gh(encodeURIComponent(file),{method:"PUT",body:JSON.stringify({message:"記入（"+file.split("-")[2]+"）",content:b64u(line+"\n"),branch:BR})});return"ok"}catch(e){return String(e)}}
async function rmEntry(file){try{const f=await gh(encodeURIComponent(file)+"?ref="+BR);await gh(encodeURIComponent(file),{method:"DELETE",body:JSON.stringify({message:"取消（"+file.split("-")[2]+"）",sha:f.sha,branch:BR})});return"ok"}catch(e){return String(e)}}
// 判定の表示。warn があるときは、記入ボタンを2回押す（確認）必要がある
function show(el,ok,line,file,warn){
  const direct=CFG&&P==="muse";
  el.innerHTML=ok?`<span class="okc">判定：有効</span>${warn?`\n<span class="ng">確認：${esc(warn)}</span>`:""}\n<code>${esc(line)}</code>\n`+(direct?`<button type="button" class="primary" id="${el.id}-write">${warn?"確認して記入する":"記入する"}</button> `:"")+`<a class="${direct?"del":"go"}" id="${el.id}-link" href="${esc(newUrl(file,line))}" target="_blank" rel="noopener">GitHubで記入する</a>`:`<span class="ng">判定：${esc(line)}（記入できません）</span>`;
  const w=document.getElementById(el.id+"-write");
  if(w)w.onclick=async()=>{
    if(warn&&!w.dataset.armed){w.dataset.armed="1";w.textContent="もう一度押すと記入します";return}
    w.disabled=true;const r=await putEntry(file,line);el.innerHTML=r==="ok"?`<span class="okc">記入しました。1〜2分後に再読み込みすると反映されます。</span>\n<code>${esc(line)}</code>`:`<span class="ng">記入できませんでした：${esc(r)}</span>\n<code>${esc(line)}</code>`};
}
const setP=p=>{P=p;document.querySelectorAll("#pseg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.p===p))};
const clearRes=id=>()=>{$(id).textContent=""};
document.querySelectorAll("#pseg button").forEach(b=>b.onclick=()=>{setP(b.dataset.p);$("f-res").textContent="";$("p-res").textContent="";render()});
// 入力が変わったら古い判定と記入ボタンを消す
for(const ev of ["input","change"]){$("tf").addEventListener(ev,clearRes("f-res"));$("pf").addEventListener(ev,clearRes("p-res"))}
const DATEMSG="日付不正（実在する、今日以前の日付を YYYY-MM-DD で入力）";
$("tf").onsubmit=e=>{e.preventDefault();$("f-res").textContent="";
  if(LOADING)return show($("f-res"),false,"読み込み中");
  const t={id:"__new",p:P,d:$("f-d").value.trim(),side:$("f-s").value,code:$("f-c").value.trim(),name:$("f-n").value.trim(),qty:num($("f-q").value),px:num($("f-px").value),ts:Date.now()};
  if(!okDate(t.d,today()))return show($("f-res"),false,DATEMSG);
  if(!t.code||!t.name||/[|｜]/.test(t.code+t.name))return show($("f-res"),false,"形式不正（コードと銘柄名を入力。「|」は使えません）");
  if(!Number.isInteger(t.qty)||t.qty<=0)return show($("f-res"),false,"形式不正（数量は 1 以上の整数）");
  if(!(t.px>0))return show($("f-res"),false,"形式不正（約定価格は 0 より大きい数）");
  const st=compute([...TR,t],PR,today()).status.get("__new");
  if(st!=="有効")return show($("f-res"),false,st);
  const a=R.acct[P],ref=(a.lastPx[t.code]||a.lastTrd[t.code]||{}).px,dev=ref?t.px/ref-1:0;
  show($("f-res"),true,`記入|${PN[P]}|${t.d}|${t.side==="buy"?"買":"売"}|${t.code}|${t.name}|${t.qty}|${t.px}`,fname(P),ref&&Math.abs(dev)>.3?`前回の価格 ${px(ref)} から ${pct(dev)} 離れています`:"");
};
$("pf").onsubmit=e=>{e.preventDefault();$("p-res").textContent="";
  if(LOADING)return show($("p-res"),false,"読み込み中");
  const p={d:$("p-d").value.trim(),code:$("p-c").value.trim(),name:$("p-n").value.trim(),px:num($("p-px").value)};
  if(!okDate(p.d,today()))return show($("p-res"),false,DATEMSG);
  if(!p.code||!p.name||/[|｜]/.test(p.code+p.name))return show($("p-res"),false,"形式不正（コードと銘柄名を入力。「|」は使えません）");
  if(!(p.px>=0)||!isFinite(p.px))return show($("p-res"),false,"形式不正（現在値は 0 以上の数）");
  const a=R.acct[P],h=a.holds.find(x=>x.code===p.code),ref=(a.lastPx[p.code]||a.lastTrd[p.code]||{}).px||(h&&h.avg),dev=ref?p.px/ref-1:0;
  const warn=p.px===0?"0 円です。保有の時価が 0 になります":ref&&Math.abs(dev)>.3?`前回の価格 ${px(ref)} から ${pct(dev)} 離れています`:!h?`${PN[P]} はこの銘柄を保有していません`:"";
  show($("p-res"),true,`現在値|${PN[P]}|${p.d}|${p.code}|${p.name}|${p.px}`,fname(P+"-px"),warn);
};
const hp=location.hash.slice(1);
if(PS.includes(hp)){setP(hp);document.querySelectorAll("#pseg button").forEach(x=>x.disabled=x.dataset.p!==hp);$("lock").textContent="記入者固定："+PN[hp]}
$("f-d").value=$("p-d").value=today();
render();
// 取消：1回目で確定ボタンに変わり、10秒以内にもう一度押すと取り消す
document.addEventListener("click",async e=>{const b=e.target.closest("button[data-rm]");if(!b)return;
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="取消を確定（10秒以内）";clearTimeout(b._t);b._t=setTimeout(()=>{if(!b.disabled){b.classList.remove("arm");b.textContent="取消（時間切れ。もう一度押す）"}},10000);return}
  clearTimeout(b._t);b.disabled=true;b.textContent="取消中";const r=await rmEntry(b.dataset.rm);b.textContent=r==="ok"?"取消済み（1〜2分で反映）":"失敗："+r});
fetch("writer.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ct){CFG=j;$("pwrow").hidden=false;render()}}).catch(()=>{});
fetch("ledger.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{TR=j.trades||[];PR=j.prices||[];BAD=(j.bad||[]).length;BUILT=j.built;LOADING=false;render()})
 .catch(()=>{LOADING=false;const c=$("conn");c.hidden=false;c.textContent="集計データを読み込めません。表示は初期状態で、正しくありません。";render();$("asof").textContent="読み込み失敗"});
}
</script>
</body>
