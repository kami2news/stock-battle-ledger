name: 株価を取得

on:
  schedule:
    # 日本時間 平日 8:50〜15:50 ごろ（UTC 23:50〜6:50）、10分ごと
    - cron: "*/10 0-6 * * 1-5"
    - cron: "50 23 * * 0-4"
  push:
    paths:
      - ".github/workflows/quotes.yml"
      - "scripts/quotes.mjs"
      - "quotes/codes.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/quotes.mjs
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add quotes/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "株価を更新"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
