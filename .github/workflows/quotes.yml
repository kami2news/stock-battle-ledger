name: 株価を取得

# 平日の朝に1回起動し、15:45（日本時間）まで 10 分ごとに株価を取得し続ける。
# 定期実行の遅れに左右されないよう、1つのジョブの中で繰り返す。
on:
  schedule:
    - cron: "35 23 * * 0-4"   # 日本時間 平日 8:35
  push:
    paths:
      - ".github/workflows/quotes.yml"
      - "scripts/quotes.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 460
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 15:45 まで 10 分ごとに取得
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          while :; do
            hm=$(TZ=Asia/Tokyo date +%H%M)
            dow=$(TZ=Asia/Tokyo date +%u)
            if [ "$dow" -ge 6 ] || [ "$hm" -gt 1545 ]; then echo "終了 $hm"; break; fi
            if [ "$hm" -ge 0850 ]; then
              git pull --rebase -q || true
              node scripts/quotes.mjs || true
              git add quotes
              if ! git diff --cached --quiet; then
                git commit -q -m "株価を更新"
                for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
              fi
            fi
            # 次の 10 分の区切りまで待つ
            s=$(( 600 - $(date +%s) % 600 + 5 ))
            sleep $s
          done
