<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>記録場 パスワード設定</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f5f5,#141414);--card:light-dark(#fff,#242424);--ink:light-dark(#242424,#f0f0f0);--sub:light-dark(#616161,#adadad);--line:light-dark(#e0e0e0,#3d3d3d);--brand:light-dark(#10218B,#9aa6f5);--ng:light-dark(#b10e1c,#ff8f99);--ok:light-dark(#0e700e,#7fd67f)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","Noto Sans JP",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--sub)}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-bottom:1px solid var(--sub);border-radius:4px;padding:6px 8px;min-height:44px}
button{font:inherit;font-weight:600;min-height:44px;border-radius:4px;border:0;background:var(--brand);color:#fff;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#141414}}
#res{white-space:pre-wrap;font-size:14px}
.ng{color:var(--ng)}.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>Muse 記入用パスワードの設定</h1>
<form class="card" id="f">
<label>GitHub のアクセストークン（このリポジトリの Contents：Read and write のみ）<input type="password" id="tok" autocomplete="off" required></label>
<label>パスワード（12 文字以上）<input type="password" id="pw1" autocomplete="new-password" minlength="12" required></label>
<label>パスワード（確認）<input type="password" id="pw2" autocomplete="new-password" required></label>
<button>暗号化して保存</button>
<div id="res" role="status" aria-live="polite"></div>
</form>
</main>
<script>
{
const REPO="kami2news/stock-battle-ledger",BR="main",ITER=600000,PATH="config/writer.json";
const $=id=>document.getElementById(id);
const b64=a=>{let o="";for(const x of new Uint8Array(a))o+=String.fromCharCode(x);return btoa(o)};
const say=(c,t)=>{$("res").className=c;$("res").textContent=t};
$("f").onsubmit=async e=>{e.preventDefault();
  const tok=$("tok").value.trim(),pw=$("pw1").value;
  if(pw.length<12)return say("ng","パスワードは 12 文字以上にしてください。");
  if(pw!==$("pw2").value)return say("ng","確認用のパスワードが一致しません。");
  say("","トークンを確認しています（1/3）");
  const H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  const api=`https://api.github.com/repos/${REPO}/contents/${PATH}`;
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}`,{headers:H});if(!r.ok)throw"トークンでリポジトリを読めません（"+r.status+"）";
    say("","暗号化しています（2/3）");
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(tok));
    const body=JSON.stringify({v:1,iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)},null,1)+"\n";
    say("","保存しています（3/3）");
    const cur=await fetch(api+"?ref="+BR,{headers:H});const sha=cur.ok?(await cur.json()).sha:undefined;
    let o="";for(const x of new TextEncoder().encode(body))o+=String.fromCharCode(x);
    const p=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify({message:"Muse 記入用の設定を更新",content:btoa(o),branch:BR,sha})});
    if(!p.ok)throw"保存できません（"+p.status+"）。トークンに Contents の書き込み権限があるか確認してください";
    $("tok").value=$("pw1").value=$("pw2").value="";
    say("ok","保存しました。1〜2 分後から、記録場でパスワードによる記入ができます。");
  }catch(err){say("ng",String(err))}
};
}
</script>
</body>
</html>
